<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Na minha mão não esquenta</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: "Inter", "DejaVu Sans", sans-serif; }
  #stage { position: absolute; inset: 0; background: #FFF3DF; overflow: hidden; }
  .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1440px; opacity: 0; display: block; }
  .char .m-open, .char .e-laugh, .char .m-sad { display: none; }
  .char.talk .m-open { display: inline; } .char.talk .m-closed { display: none; }
  .char.laugh .e-open { display: none; } .char.laugh .e-laugh, .char.laugh .m-open { display: inline; } .char.laugh .m-closed { display: none; }
  .char.sad .m-closed, .char.sad .m-open { display: none; } .char.sad .m-sad { display: inline; }
  svg text { font-family: "Inter", sans-serif; }

  #capbg { position: absolute; left: 0; right: 0; top: 1440px; bottom: 0; background: #FFFBF3; box-shadow: 0 -12px 30px rgba(0,0,0,.10); }
  #capbox { position: absolute; left: 56px; right: 56px; top: 1470px; height: 380px; display: flex; align-items: center; justify-content: center; text-align: center; }
  #cap { font-weight: 800; font-size: 58px; line-height: 1.2; color: #1B1F3B; letter-spacing: -0.6px; }
  #cap.punch { font-size: 66px; }
  #cap .hl { background: linear-gradient(transparent 12%, #FFD23F 12%, #FFD23F 92%, transparent 92%); padding: 0 8px; border-radius: 8px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  #cap .idle { color: #B9B1A3; font-size: 38px; font-weight: 700; letter-spacing: 0; }

  .bubble { position: absolute; background: #fff; border-radius: 46px; padding: 32px 40px; font-weight: 800; font-size: 50px;
            line-height: 1.2; color: #1B1F3B; opacity: 0; transform-origin: 50% 100%;
            box-shadow: 0 18px 40px rgba(27,31,59,.18), 0 3px 0 rgba(27,31,59,.06); }
  .bubble::after { content: ""; position: absolute; bottom: -34px; width: 0; height: 0; border-left: 24px solid transparent; border-right: 24px solid transparent; border-top: 36px solid #fff; }
  .bubble.tail-l::after { left: 100px; } .bubble.tail-r::after { right: 100px; } .bubble.tail-c::after { left: calc(50% - 24px); }
  .bubble u { text-decoration-color: #E4572E; text-decoration-thickness: 6px; text-underline-offset: 6px; }

  #end { position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 80px;
         background: radial-gradient(circle at 50% 35%, #2A2F5C 0%, #14172E 70%); }
  #end h1 { color: #fff; font-size: 106px; font-weight: 900; line-height: 1.06; letter-spacing: -2.5px; }
  #end h1 span { color: #FFD23F; }
  #end .tag { margin-top: 64px; color: #FFB4A2; font-size: 46px; font-weight: 800; }
  #end .ai { position: absolute; bottom: 70px; left: 0; right: 0; color: #8C8FB0; font-size: 30px; font-weight: 500; }
  #progress { position: absolute; left: 0; bottom: 0; height: 10px; background: linear-gradient(90deg, #E4572E, #FFD23F); width: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="capbg"></div>
  <div id="bubbles"></div>
  <div id="capbox"><div id="cap"></div></div>
  <div id="end">
    <h1>Sem povo com renda,<br>não tem empresa.<br><span>Nem país.</span></h1>
    <div class="tag">Dinheiro que circula é dinheiro que trabalha.</div>
    <div class="ai">Animação produzida com auxílio de inteligência artificial</div>
  </div>
  <div id="progress"></div>
</div>

<script>
// ================= helpers =================
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const backOut = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const win = (t, a, b, f = .35) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
const $ = id => document.getElementById(id);
const tr = (id, s) => { const e = $(id); if (e) e.setAttribute('transform', s); };
const place = (id, x, y, s = 1, r = 0, flip = false) => tr(id, `translate(${x} ${y}) rotate(${r}) scale(${flip ? -s : s} ${s})`);
const op = (id, o) => { const e = $(id); if (e) e.style.opacity = o; };
const attr = (id, k, v) => { const e = $(id); if (e) e.setAttribute(k, v); };
const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 9973; return h / 9973 * 6.28; };
const shade = (hex, p) => { const n = parseInt(hex.slice(1), 16); const f = v => Math.round(p < 0 ? v * (1 + p) : v + (255 - v) * p);
  return '#' + [n >> 16, n >> 8 & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join(''); };
const setMood = (id, mood) => { const e = $(id); if (!e) return; e.classList.remove('talk', 'laugh', 'sad'); if (mood) e.classList.add(mood); };
const talking = t => Math.floor(t * 9) % 3 !== 0;
const pop = (id, t, a, b, cx, cy) => { const p = prog(t, a, a + .4), o = win(t, a, b, .25);
  tr(id, `translate(${cx} ${cy}) scale(${Math.max(.001, backOut(p))}) translate(${-cx} ${-cy})`); op(id, t < a ? 0 : o); };

// ================= character system =================
// feet at (0,0), ~200 units tall, facing viewer
function person(id, o = {}) {
  const skin = o.skin || '#C68642', skD = shade(skin, -.22);
  const top = o.top || '#4A90D9', topD = shade(top, -.25);
  const pants = o.pants || '#34495E', shoes = o.shoes || '#2B2B33', hc = o.hairC || '#2B1B12';
  const legC = o.dress ? skin : pants;
  const sleeve = o.suit ? top : top, fore = o.longSleeve || o.suit ? top : skin;
  let back = '', front = '';
  const H = {
    rosa: [`<circle cx="-25" cy="-176" r="15"/><circle cx="25" cy="-176" r="15"/><circle cx="0" cy="-198" r="19"/><circle cx="-31" cy="-157" r="11"/><circle cx="31" cy="-157" r="11"/><circle cx="-14" cy="-192" r="13"/><circle cx="14" cy="-192" r="13"/>`,
           `<path d="M-30 -158 Q-31 -193 0 -193 Q31 -193 30 -158 Q20 -177 0 -178 Q-20 -177 -30 -158Z"/>
            <path d="M-27 -171 Q0 -191 27 -171" stroke="#F2C14E" stroke-width="6.5" fill="none" stroke-linecap="round"/>
            <g transform="translate(25 -180)"><circle r="6.5" cy="-7" fill="#FF7FA8"/><circle r="6.5" cx="7" fill="#FF7FA8"/><circle r="6.5" cy="7" fill="#FF7FA8"/><circle r="6.5" cx="-7" fill="#FF7FA8"/><circle r="4.5" fill="#FFD23F"/></g>`],
    short: ['', `<path d="M-30 -154 Q-33 -195 0 -195 Q33 -195 30 -154 Q28 -172 14 -179 Q-6 -171 -26 -175 Q-30 -166 -30 -154Z"/>`],
    afro: [`<circle cx="0" cy="-170" r="37"/>`, `<path d="M-30 -160 Q-26 -186 0 -188 Q26 -186 30 -160 Q16 -172 0 -172 Q-16 -172 -30 -160Z"/>`],
    long: [`<path d="M-35 -160 Q-37 -197 0 -197 Q37 -197 35 -160 L37 -108 Q0 -100 -37 -108Z"/>`, `<path d="M-30 -154 Q-31 -193 0 -193 Q31 -193 30 -154 Q22 -170 4 -179 Q-14 -168 -30 -154Z"/>`],
    pony: [`<ellipse cx="33" cy="-150" rx="10" ry="24" transform="rotate(-15 33 -150)"/>`, `<path d="M-30 -154 Q-31 -193 0 -193 Q31 -193 30 -154 Q20 -174 -2 -178 Q-20 -172 -30 -154Z"/>`],
    bald: ['', `<path d="M-30 -146 Q-32 -168 -24 -176 L-22 -146Z M30 -146 Q32 -168 24 -176 L22 -146Z"/><ellipse cx="-9" cy="-180" rx="9" ry="5" fill="#fff" opacity=".25"/>`],
    slick: ['', `<path d="M-31 -152 Q-35 -197 4 -195 Q35 -191 31 -154 Q26 -179 -2 -181 Q-22 -179 -31 -152Z"/><path d="M-12 -190 Q10 -186 26 -172" stroke="#fff" stroke-width="2.5" opacity=".35" fill="none"/>`],
    cap: ['', `<path d="M-30 -154 Q-33 -186 0 -186 Q33 -186 30 -154Z"/><path d="M-32 -166 Q-31 -199 0 -199 Q31 -199 32 -166Z" fill="${o.capC || '#2B6CB0'}"/><path d="M-6 -170 Q30 -175 52 -165 Q30 -160 -6 -164Z" fill="${shade(o.capC || '#2B6CB0', -.25)}"/>`],
    helmet: ['', `<path d="M-34 -164 Q-33 -204 0 -204 Q33 -204 34 -164Z" fill="#F7C531"/><rect x="-39" y="-169" width="78" height="9" rx="4.5" fill="#E0A800"/><rect x="-4" y="-204" width="8" height="35" rx="3" fill="#E0A800"/>`],
    straw: ['', `<ellipse cx="0" cy="-171" rx="54" ry="11" fill="#E3C27A"/><path d="M-28 -171 Q-27 -205 0 -205 Q27 -205 28 -171Z" fill="#EBD192"/><rect x="-28" y="-180" width="56" height="7" fill="#B5462E"/>`],
  }[o.hair || 'short'];
  back = H[0]; front = H[1];
  const torso = o.dress
    ? `<path d="M-30 -116 Q0 -128 30 -116 Q41 -80 49 -34 Q0 -24 -49 -34 Q-41 -80 -30 -116Z" fill="${top}"/><path d="M10 -123 Q24 -121 30 -116 Q41 -80 49 -34 Q32 -29 16 -28 Q22 -80 10 -123Z" fill="#000" opacity=".11"/>`
    : `<path d="M-30 -116 Q0 -128 30 -116 Q37 -92 35 -62 Q0 -54 -35 -62 Q-37 -92 -30 -116Z" fill="${top}"/><path d="M10 -123 Q24 -121 30 -116 Q37 -92 35 -62 Q24 -59 14 -58 Q20 -92 10 -123Z" fill="#000" opacity=".11"/>`;
  const apron = o.apron ? `<path d="M-20 -104 Q0 -100 20 -104 L${o.dress ? 27 : 24} ${o.dress ? -40 : -60} Q0 ${o.dress ? -34 : -55} -${o.dress ? 27 : 24} ${o.dress ? -40 : -60}Z" fill="${o.apron}"/><path d="M-20 -104 L-12 -122 M20 -104 L12 -122" stroke="${o.apron}" stroke-width="4"/>` : '';
  const suit = o.suit ? `<path d="M-9 -123 L0 -96 L9 -123Z" fill="#fff"/><path d="M-3 -116 L3 -116 L5 -82 L0 -74 L-5 -82Z" fill="${o.tie || '#D7263D'}"/><path d="M-12 -122 L0 -96 L-20 -104Z M12 -122 L0 -96 L20 -104Z" fill="${topD}"/>` : `<path d="M-10 -123 Q0 -114 10 -123" stroke="${topD}" stroke-width="3.5" fill="none"/>`;
  const label = o.label ? `<rect x="-24" y="${o.apron ? -92 : -100}" width="48" height="16" rx="4" fill="#fff" opacity=".92"/><text x="0" y="${o.apron ? -80 : -88}" font-size="10.5" font-weight="800" text-anchor="middle" fill="#1B1F3B">${o.label}</text>` : '';
  const items = {
    pote: `<g transform="translate(41 -66)"><rect x="-10" y="-8" width="20" height="25" rx="4" fill="#FBF0DA" stroke="#C99A6B" stroke-width="2"/><rect x="-10" y="-1" width="20" height="6" fill="#7B3F1E"/><rect x="-10" y="7" width="20" height="5" fill="#F2B5C4"/><rect x="-11" y="-12" width="22" height="5" rx="2" fill="#E4572E"/></g>`,
    phone: `<rect x="35" y="-78" width="13" height="22" rx="3" fill="#1B1F3B"/><rect x="36.5" y="-75.5" width="10" height="16" rx="1.5" fill="#7FD8FF"/>`,
    bag: `<g transform="translate(41 -58)"><path d="M-12 0 h24 l4 30 h-32z" fill="#F4A261"/><path d="M-6 0 Q0 -10 6 0" stroke="#8a5a2b" stroke-width="2.5" fill="none"/><rect x="-7" y="-6" width="5" height="9" fill="#7CB518"/></g>`,
    clip: `<g transform="translate(41 -70)"><rect x="-11" y="-2" width="22" height="28" rx="2" fill="#C8A165"/><rect x="-8" y="2" width="16" height="20" fill="#fff"/></g>`,
    wrench: `<g transform="translate(41 -60) rotate(-30)"><rect x="-3" y="-22" width="6" height="30" rx="2" fill="#9AA5AD"/><circle cy="-24" r="7" fill="#9AA5AD"/></g>`,
    watch: `<rect x="34" y="-66" width="12" height="7" rx="2" fill="#F2C14E"/>`,
  };
  const eyesOpen = `<g class="e-open"><ellipse cx="-11" cy="-159" rx="6" ry="7" fill="#fff"/><ellipse cx="11" cy="-159" rx="6" ry="7" fill="#fff"/><circle cx="-10.5" cy="-158" r="4.2" fill="#2A1A12"/><circle cx="11.5" cy="-158" r="4.2" fill="#2A1A12"/><circle cx="-9" cy="-160" r="1.5" fill="#fff"/><circle cx="13" cy="-160" r="1.5" fill="#fff"/></g>`;
  const eyesLaugh = `<g class="e-laugh" stroke="#2A1A12" stroke-width="3.2" fill="none" stroke-linecap="round"><path d="M-17 -157 Q-11 -165 -5 -157"/><path d="M5 -157 Q11 -165 17 -157"/></g>`;
  const shades = o.shades ? `<rect x="-22" y="-166" width="18" height="12" rx="4" fill="#111"/><rect x="4" y="-166" width="18" height="12" rx="4" fill="#111"/><rect x="-4" y="-163" width="8" height="3" fill="#111"/><path d="M-18 -163 L-12 -163" stroke="#fff" stroke-width="2" opacity=".5"/>` : '';
  const glasses = o.glasses ? `<circle cx="-11" cy="-159" r="9.5" fill="none" stroke="#3a3a3a" stroke-width="2.5"/><circle cx="11" cy="-159" r="9.5" fill="none" stroke="#3a3a3a" stroke-width="2.5"/><path d="M-1.5 -160 L1.5 -160" stroke="#3a3a3a" stroke-width="2.5"/>` : '';
  const stache = o.stache ? `<path d="M-13 -146 Q-6 -152 0 -147 Q6 -152 13 -146 Q6 -141 0 -143.5 Q-6 -141 -13 -146Z" fill="${o.stacheC || hc}"/>` : '';
  const beard = o.beard ? `<path d="M-27 -152 Q-25 -121 0 -117 Q25 -121 27 -152 Q20 -134 0 -132 Q-20 -134 -27 -152Z" fill="${hc}" opacity=".92"/>` : '';
  return `<g id="${id}" class="char">
    <ellipse cx="0" cy="0" rx="38" ry="8" fill="#1B1F3B" opacity=".14"/>
    <g id="${id}-legL"><rect x="-19" y="-72" width="16" height="68" rx="8" fill="${legC}"/><ellipse cx="-13" cy="-4" rx="13" ry="6.5" fill="${shoes}"/></g>
    <g id="${id}-legR"><rect x="3" y="-72" width="16" height="68" rx="8" fill="${shade(legC, -.08)}"/><ellipse cx="13" cy="-4" rx="13" ry="6.5" fill="${shoes}"/></g>
    <g id="${id}-up">
      ${o.dress ? '' : `<rect x="-34" y="-70" width="68" height="12" rx="6" fill="${shade(pants, -.1)}"/>`}
      ${torso}${apron}${suit}${label}
      <g id="${id}-armL"><path d="M-29 -113 Q-38 -97 -38 -80" stroke="${sleeve}" stroke-width="17" stroke-linecap="round" fill="none"/><path d="M-38 -82 L-39 -61" stroke="${fore}" stroke-width="13" stroke-linecap="round"/><circle cx="-39" cy="-57" r="8.5" fill="${skin}"/></g>
      <g id="${id}-armR"><path d="M29 -113 Q38 -97 38 -80" stroke="${shade(sleeve, -.06)}" stroke-width="17" stroke-linecap="round" fill="none"/><path d="M38 -82 L39 -61" stroke="${fore}" stroke-width="13" stroke-linecap="round"/><circle cx="39" cy="-57" r="8.5" fill="${skin}"/>${o.item ? items[o.item] : ''}</g>
      <rect x="-7.5" y="-134" width="15" height="16" rx="5" fill="${skD}"/>
      <g id="${id}-head">
        <g fill="${hc}">${back}</g>
        <ellipse cx="-28" cy="-155" rx="5.5" ry="8" fill="${skin}"/><ellipse cx="28" cy="-155" rx="5.5" ry="8" fill="${skD}"/>
        ${o.earrings ? `<circle cx="-29" cy="-145" r="4" fill="#F2C14E"/><circle cx="29" cy="-145" r="4" fill="#F2C14E"/>` : ''}
        <ellipse cx="0" cy="-157" rx="29" ry="32" fill="${skin}"/>
        <path d="M12 -186 Q30 -176 29 -157 Q28 -136 10 -126 Q22 -150 12 -186Z" fill="#000" opacity=".08"/>
        <g id="${id}-eyes">${eyesOpen}${eyesLaugh}</g>
        <path d="M-17 -171 Q-11 -175 -5 -171 M5 -171 Q11 -175 17 -171" stroke="${shade(hc, .1)}" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M-1 -153 Q3 -147 -1 -145" stroke="${skD}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <circle cx="-17" cy="-146" r="5.5" fill="#E86A6A" opacity=".28"/><circle cx="17" cy="-146" r="5.5" fill="#E86A6A" opacity=".28"/>
        ${beard}
        <path class="m-closed" d="M-9 -139 Q0 -132 9 -139" stroke="#5A2516" stroke-width="3" fill="none" stroke-linecap="round"/>
        <g class="m-open"><path d="M-10 -140 Q0 -124 10 -140Z" fill="#6B1F1F"/><path d="M-5 -131 Q0 -128 5 -131 Q0 -134 -5 -131Z" fill="#E86A6A"/></g>
        <path class="m-sad" d="M-9 -134 Q0 -141 9 -134" stroke="#5A2516" stroke-width="3" fill="none" stroke-linecap="round"/>
        ${stache}${glasses}${shades}
        <g fill="${hc}">${front}</g>
      </g>
    </g>
  </g>`;
}
// per-frame life: breathing, blinking, walking, gestures
function life(id, t, o = {}) {
  const ph = hash(id);
  let bob = Math.sin(t * 2.3 + ph) * 1.6;
  if (o.walk) {
    const a = Math.sin(t * 9 + ph) * 22;
    tr(id + '-legL', `rotate(${a} -11 -70)`); tr(id + '-legR', `rotate(${-a} 11 -70)`);
    tr(id + '-armL', `rotate(${-a * .7} -29 -112)`); tr(id + '-armR', `rotate(${a * .7} 29 -112)`);
    bob = -Math.abs(Math.sin(t * 9 + ph)) * 4;
  } else {
    tr(id + '-legL', ''); tr(id + '-legR', '');
    tr(id + '-armL', `rotate(${o.armL || 0} -29 -112)`); tr(id + '-armR', `rotate(${o.armR || 0} 29 -112)`);
  }
  tr(id + '-up', `translate(0 ${bob})`);
  tr(id + '-head', `rotate(${(o.tilt || 0) + Math.sin(t * 1.3 + ph) * 1.5} 0 -130)`);
  const bl = ((t + ph) % 3.9) < .13;
  tr(id + '-eyes', bl ? 'translate(0 -159) scale(1 .12) translate(0 159)' : '');
}

// ================= props & buildings =================
const DEFS = `<defs>
  <filter id="ds" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1B1F3B" flood-opacity=".18"/></filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="gold" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#FFF1A8"/><stop offset=".5" stop-color="#F7C531"/><stop offset="1" stop-color="#C98A06"/></radialGradient>
  <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FD3FF"/><stop offset="1" stop-color="#E4F6FF"/></linearGradient>
  <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151A3A"/><stop offset="1" stop-color="#3B3F73"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BFE9FF"/><stop offset="1" stop-color="#6FB7DD"/></linearGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BD36A"/><stop offset="1" stop-color="#6DB84A"/></linearGradient>
  <linearGradient id="money" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7BD389"/><stop offset="1" stop-color="#3E9B54"/></linearGradient>
</defs>`;
const coinPlain = (id, r = 22) => `<g id="${id}"><circle r="${r}" fill="url(#gold)" stroke="#B07A05" stroke-width="${r * .12}"/><circle r="${r * .7}" fill="none" stroke="#E2A80F" stroke-width="${r * .08}"/><text y="${r * .32}" font-size="${r * .85}" font-weight="900" text-anchor="middle" fill="#8A5A00">R$</text><ellipse cx="${-r * .35}" cy="${-r * .45}" rx="${r * .25}" ry="${r * .12}" fill="#fff" opacity=".6" transform="rotate(-30 ${-r * .35} ${-r * .45})"/></g>`;
const coinFace = (id, sleepy) => `<g id="${id}"><circle r="34" fill="url(#gold)" stroke="#B07A05" stroke-width="4.5"/><circle r="25" fill="none" stroke="#E2A80F" stroke-width="3"/>
  ${sleepy ? `<path d="M-14 -4 Q-9 0 -4 -4 M4 -4 Q9 0 14 -4" stroke="#5a4300" stroke-width="3.5" fill="none" stroke-linecap="round"/>` : `<ellipse cx="-9" cy="-6" rx="4" ry="5.5" fill="#3a2a00"/><ellipse cx="9" cy="-6" rx="4" ry="5.5" fill="#3a2a00"/>`}
  <path d="M-8 9 Q0 14 8 9" stroke="#3a2a00" stroke-width="3.5" fill="none" stroke-linecap="round"/><ellipse cx="-14" cy="-18" rx="8" ry="4" fill="#fff" opacity=".55" transform="rotate(-30 -14 -18)"/></g>`;
const cash = (id, label = 'R$ 1.000') => `<g id="${id}"><g transform="rotate(-4)"><rect x="-82" y="-40" width="164" height="80" rx="10" fill="url(#money)"/><rect x="-74" y="-32" width="148" height="64" rx="6" fill="none" stroke="#fff" stroke-width="2.5" opacity=".5"/><circle cx="-48" cy="0" r="19" fill="#fff" opacity=".25"/><text x="16" y="11" font-size="29" font-weight="900" text-anchor="middle" fill="#fff">${label}</text></g></g>`;

const SC = { s1: [0, 6.1], s2a: [6.0, 10.6], s2b: [10.5, 27.7], s2c: [27.6, 34.7], s3: [34.6, 50.7], s4: [50.6, 59.3], s4b: [59.2, 69.7], s5: [69.6, 75.3], s6: [75.2, 84.8] };
const END = 84.6, TOTAL = 90.5;

// ================= render =================
function render(t) {
  for (const [id, [a, b]] of Object.entries(SC)) { const o = a === 0 ? 1 - prog(t, b - .3, b) : win(t, a, b, .3); op(id, o); $(id).style.display = o > 0 ? 'block' : 'none'; }

  if (t < 6.2) { // S1
    const p = easeOut(prog(t, 0, .8));
    place('s1-p', lerp(-300, 540, p), 1360, 3.3);
    life('rosa1', t, { walk: t < .8, armR: t > .8 && t < 1.7 ? -20 : 0 });
    setMood('rosa1', t > 1.9 && t < 4.8 ? 'laugh' : null);
    const np = ease(prog(t, .9, 1.7)); place('s1-cash', lerp(560, 410, np), lerp(-120, 1150, np), 1.2, lerp(-30, 8, np));
    op('s1-cash', 1 - prog(t, 1.9, 2.2));
  }
  if (t > 5.9 && t < 10.7) { // S2a
    place('s2a-rosa', 260, 680, 2.0); life('rosa2', t, { armR: t > 7 && t < 8.4 ? -25 : 0 }); setMood('rosa2', t > 7.4 && t < 9 ? 'laugh' : null);
    place('s2a-rico', 260, 1400, 2.0); life('rico2', t);
    const a = ease(prog(t, 6.4, 7.2)), b = ease(prog(t, 6.6, 7.4));
    place('s2a-c1', lerp(380, 340, a), lerp(-100, 560, a), .8, lerp(-20, 6, a)); op('s2a-c1', 1 - prog(t, 9.6, 10));
    place('s2a-c2', lerp(380, 340, b), lerp(700, 1280, b), .8, lerp(-20, 6, b)); op('s2a-c2', 1 - prog(t, 9.6, 10));
  }
  if (t > 10.4 && t < 27.8) { // S2b chain
    const [cx, cy, z] = cam(t); tr('cam', `translate(540 760) scale(${z}) translate(${-cx} ${-cy})`);
    const ppl = { 'wp-rosa': ['rosa3', W.rosa], 'wp-ana': ['ana', W.ana], 'wp-jorge': ['jorge3', W.jorge], 'wp-mot': ['mot', W.mot], 'wp-atac': ['atac', W.atac],
                  'wp-op1': ['op1', W.op1], 'wp-op2': ['op2', W.op2], 'wp-op3': ['op3', W.op3], 'wp-agri': ['agri', W.agri] };
    for (const [g, [pid, p]] of Object.entries(ppl)) { place(g, p[0], p[1], 1); life(pid, t); }
    let count = 0;
    FLOWS.forEach((f, i) => {
      const p = ease(prog(t, f.t, f.t + f.d)), L = trLens[i];
      attr('tr' + i, 'stroke-dasharray', `${L * p} ${L + 10}`); op('tr' + i, t > f.t ? .85 : 0);
      const pt = $('tr' + i).getPointAtLength(L * p);
      place('fl' + i, pt.x, pt.y, 1, (t - f.t) * 360); op('fl' + i, t > f.t && t < f.t + f.d + .15 ? 1 : 0);
      const arr = f.t + f.d; const rp = prog(t, arr, arr + .7);
      attr('ring' + i, 'r', 30 + rp * 70); op('ring' + i, t > arr ? (1 - rp) : 0);
      pop('chp' + i, t, arr, arr + 1.6, f.to[0], f.to[1] - 87);
      if (t > arr && f.count) count += f.count;
    });
    $('cnt').textContent = count;
    pop('counter', t, 11.4, 99, 540, 84);
    // happy reactions
    setMood('jorge3', t > 13.0 && t < 14.6 ? 'laugh' : null); setMood('ana', t > 14.5 && t < 16 ? 'laugh' : null);
    setMood('mot', t > 17.7 && t < 19.2 ? 'laugh' : null); setMood('atac', t > 15.9 && t < 17.2 ? 'laugh' : null);
    ['op1', 'op2', 'op3'].forEach(o => setMood(o, t > 21.1 && t < 22.8 ? 'laugh' : null)); setMood('agri', t > 22.6 && t < 24.4 ? 'laugh' : null);
    setMood('rosa3', t > 10.5 && t < 11.4 ? 'talk' : null);
    // truck
    const tp = ease(prog(t, 15.0, 17.0)); place('truck', lerp(1250, 980, tp), 2470, 1);
    const wr = tp * 720; tr('wh1', `translate(-80 -6) rotate(${wr})`); tr('wh2', `translate(100 -6) rotate(${wr})`);
    for (let i = 0; i < 6; i++) { const ph = ((t * .35) + i / 6) % 1; const cx2 = i % 2 ? 1985 : 1910; attr('smk' + i, 'cx', cx2 + ph * 60); attr('smk' + i, 'cy', 900 - ph * 260); attr('smk' + i, 'r', 24 + ph * 30); op('smk' + i, .85 * (1 - ph)); }
  }
  if (t > 27.5 && t < 34.8) { // S2c vault
    place('s2c-rico', 290, 1330, 2.2); life('rico4', t); setMood('rico4', t > 28.4 && t < 29.4 ? 'talk' : null);
    const c = ease(prog(t, 27.9, 29.0)); place('s2c-cash', lerp(380, 760, c), lerp(1210, 1000, c), lerp(.8, .4, c), c * 30); op('s2c-cash', 1 - prog(t, 28.9, 29.2));
    place('s2c-coin', 760, lerp(940, 1000, prog(t, 29.0, 29.5)), 1.2); op('s2c-coin', prog(t, 29.0, 29.4));
    const zt = Math.max(0, t - 29.3);
    ['z1', 'z2', 'z3'].forEach((z, i) => { const ph = ((zt * .6) + i / 3) % 1; attr(z, 'x', 800 + ph * 90 + i * 10); attr(z, 'y', 930 - ph * 200); op(z, t > 29.3 ? Math.sin(ph * Math.PI) : 0); });
    tr('hand1', `rotate(${(t - 27.5) * 120})`); tr('hand2', `rotate(${(t - 27.5) * 12})`);
  }
  if (t > 34.5 && t < 50.8) { // S3 street
    place('s3-jorge', 650, 1112, 1.05); life('jorge5', t);
    setMood('jorge5', t > 47.4 ? 'sad' : (t > 37.6 && t < 40.4 ? 'laugh' : null));
    crowd.forEach(([id, , x0, y, s, dir, sp, leave]) => {
      const el = t - 34.6; let x = x0 + dir * sp * el; const tl = leave - 34.6;
      const span = 1300; if (t < leave) { x = ((x + 110) % span + span) % span - 110; } else { let xl = x0 + dir * sp * tl; xl = ((xl + 110) % span + span) % span - 110; x = xl + dir * sp * 3.2 * (t - leave); }
      place('cw-' + id, x, y, s, 0, dir < 0); life(id, t, { walk: true }); op('cw-' + id, 1 - prog(t, leave + .6, leave + 1.6));
    });
    for (let i = 0; i < 12; i++) { const st = 34.9 + i * .23, p = prog(t, st, st + 1.0);
      const x = [90, 240, 420, 560, 700, 880, 1000, 160, 330, 620, 790, 960][i], y = i % 2 ? 1230 : 1360;
      place('rc' + i, x, lerp(-60, y, ease(p)), 1, p * 360); op('rc' + i, p > 0 ? 1 - prog(t, st + 1.0, st + 1.3) : 0); }
    const on = t > 35.4 && t < 46.4;
    op('pad-glow', on || (t >= 46.4 && t < 46.9) ? .6 : 0); op('mk3-glow', t > 35.8 && t < 47.0 ? .6 : 0); op('far3-glow', t > 36.2 && t < 46.0 ? .6 : 0);
    pop('contrata', t, 37.9, 46.3, 485, 920);
    const tv = win(t, 40.5, 45.9, .4); op('tv', tv); tr('tv', `translate(540 300) scale(${.9 + .1 * backOut(prog(t, 40.5, 40.9))}) translate(-540 -300)`);
    const ln = $('tv-line'), L = 820; ln.setAttribute('stroke-dasharray', L); ln.setAttribute('stroke-dashoffset', L * (1 - ease(prog(t, 40.8, 42.1))));
    for (let i = 0; i < 28; i++) { const ph = (prog(t, 41.9, 45.9) * 1.3 + (i * .137) % 1) % 1; const x = 210 + (i * 97) % 640;
      attr('cf' + i, 'x', x); attr('cf' + i, 'y', 110 + ph * 360); tr('cf' + i, `rotate(${ph * 720 + i * 30} ${x + 7} ${121 + ph * 360})`); op('cf' + i, t > 41.9 ? 1 : 0); }
    op('s3-night', .75 * prog(t, 45.8, 47.6)); op('sun', 1 - prog(t, 45.8, 47));
    const dp = ease(prog(t, 47.4, 48.8)); const d = $('mk3-door'); d.setAttribute('height', (400 - 154) * dp);
    for (let i = 0; i < 12; i++) op(`mk3-sl${i}`, (14 + i * 20) < (400 - 154) * dp ? 1 : 0);
    pop('passa', t, 48.7, 99, 550, 840);
  }
  if (t > 50.5 && t < 59.4) { // S4 kitchen
    place('s4-rosa', 270, 1300, 2.7); place('s4-filho', 820, 1300, 2.6);
    const ft = t > 50.9 && t < 55.0, rt = t > 55.4 && t < 59.0;
    life('rosa6', t, { armR: rt ? -35 : 0, tilt: rt ? -4 : 0 }); life('filho', t, { armL: ft ? 30 : 0 });
    setMood('filho', ft && talking(t) ? 'talk' : null); setMood('rosa6', rt ? 'laugh' : null);
  }
  if (t > 59.1 && t < 69.8) { // S4b
    place('s4b-rico', 270, 830, 2.3); place('s4b-filho', 820, 1150, 2.1);
    life('rico7', t, { armR: t > 60.1 && t < 61 ? -40 : 0 }); life('filho7', t);
    const bp = ease(prog(t, 59.4, 60.2)); place('bag', lerp(330, 380, bp), lerp(-140, 700, bp), .85); op('bag', 1 - prog(t, 60.6, 60.9));
    setMood('rico7', t > 60.1 && t < 61.6 ? 'laugh' : (t > 63.5 && t < 65 ? 'laugh' : null));
    const up = $('uturn'), L = up.getTotalLength(), rp = ease(prog(t, 60.8, 63.4));
    up.setAttribute('stroke-dasharray', `${L * rp} ${L}`); op('uturn', t > 60.8 ? 1 : 0);
    const pt = up.getPointAtLength(L * rp), pt2 = up.getPointAtLength(Math.max(0, L * rp - 5));
    const ang = Math.atan2(pt.y - pt2.y, pt.x - pt2.x) * 180 / Math.PI;
    place('s4b-coin', pt.x, pt.y, 1, rp * 720); op('s4b-coin', t > 60.8 && t < 63.6 ? 1 : 0);
    place('uturn-head', pt.x, pt.y, 1, ang); op('uturn-head', t > 63.4 ? 1 : 0);
    pop('tag1', t, 63.6, 99, 195, 218); pop('tag2', t, 64.0, 99, 515, 218); pop('tag3', t, 64.4, 99, 860, 218);
    pop('holerite', t, 65.4, 99, 815, 1290); setMood('filho7', t > 65.4 ? 'sad' : null);
  }
  if (t > 69.5 && t < 75.4) { // S5
    pop('lock', t, 70.0, 99, 100, 80);
    for (let i = 0; i < 3; i++) { const ct = 71.2 + i * .9; op(`card${i}-grey`, .55 * prog(t, ct, ct + .4)); op(`card${i}-crack`, prog(t, ct, ct + .2));
      const sh = t > ct && t < ct + .3 ? Math.sin(t * 90) * 7 : 0; tr('card' + i, `translate(${sh} 0)`); }
  }
  if (t > 75.1 && t < 84.9) { // S6
    const zp = ease(prog(t, 75.2, 76.0)); place('s6-rosa', 540, lerp(1600, 1640, zp), lerp(3.6, 4.6, zp));
    const talkW = t > 75.6 && t < 81.0;
    life('rosa8', t, { armL: talkW ? 20 + Math.sin(t * 3) * 8 : 0, tilt: t > 81.2 ? -5 : 0 });
    setMood('rosa8', t > 81.2 ? 'laugh' : (talkW && talking(t) ? 'talk' : null));
  }
  for (const b of bubbles) { const e = $(b.id), o = win(t, b.a, b.b, .25), p = backOut(prog(t, b.a, b.a + .38)); e.style.opacity = t < b.a ? 0 : o; e.style.transform = `scale(${Math.max(.001, t < b.a ? 0 : p)})`; }
  const ci = caps.findIndex(c => t >= c.a && t < c.b);
  if (ci !== capCur) { capCur = ci; if (ci >= 0) { capEl.innerHTML = caps[ci].html; capEl.className = caps[ci].punch ? 'punch' : ''; } else { capEl.innerHTML = '<span class="idle">🍰 Dona Rosa explica a economia</span>'; capEl.className = ''; } }
  if (ci >= 0) { const c = caps[ci]; capEl.style.opacity = win(t, c.a, c.b, .25); capEl.style.transform = `translateY(${(1 - easeOut(prog(t, c.a, c.a + .3))) * 26}px)`; } else { capEl.style.opacity = 1; capEl.style.transform = 'none'; }
  $('end').style.opacity = prog(t, END, END + .5);
  $('end').style.transform = `scale(${1.04 - .04 * easeOut(prog(t, END, END + 1.2))})`;
  $('progress').style.width = (1080 * t / TOTAL) + 'px';
}
window.render = render; window.TOTAL = TOTAL;
render(0);
</script>
