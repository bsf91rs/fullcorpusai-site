<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Na minha mão não esquenta</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: "Inter", "DejaVu Sans", sans-serif; }
  #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; background: #FFE8C2; overflow: hidden; }
  .scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1450px; opacity: 0; }
  svg.scene { display: block; }
  .char .m-open, .char .e-laugh, .char .m-sad { display: none; }
  .char.talk .m-open { display: inline; }
  .char.talk .m-closed { display: none; }
  .char.laugh .e-open { display: none; }
  .char.laugh .e-laugh, .char.laugh .m-open { display: inline; }
  .char.laugh .m-closed { display: none; }
  .char.sad .m-closed, .char.sad .m-open { display: none; }
  .char.sad .m-sad { display: inline; }

  #capbox { position: absolute; left: 50px; right: 50px; top: 1490px; height: 340px;
            display: flex; align-items: center; justify-content: center; text-align: center; }
  #cap { font-weight: 800; font-size: 60px; line-height: 1.18; color: #1d1d1f; letter-spacing: -0.5px; }
  #cap.punch { font-size: 66px; color: #1d1d1f; }
  #cap .hl { background: #FFD23F; padding: 0 10px; border-radius: 10px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  #capbg { position: absolute; left: 0; right: 0; top: 1450px; bottom: 0; background: #FFFFFF; }

  .bubble { position: absolute; background: #fff; border: 6px solid #1d1d1f; border-radius: 44px;
            padding: 30px 38px; font-weight: 800; font-size: 50px; line-height: 1.2; color: #1d1d1f;
            opacity: 0; transform-origin: 50% 100%; box-shadow: 0 10px 0 rgba(0,0,0,.12); }
  .bubble::after { content: ""; position: absolute; bottom: -40px; width: 0; height: 0;
            border-left: 26px solid transparent; border-right: 26px solid transparent; border-top: 40px solid #1d1d1f; }
  .bubble.tail-l::after { left: 90px; }
  .bubble.tail-r::after { right: 90px; }
  .bubble.tail-c::after { left: calc(50% - 26px); }

  #end { position: absolute; inset: 0; background: #1d1d1f; opacity: 0; display: flex; flex-direction: column;
         align-items: center; justify-content: center; text-align: center; padding: 0 80px; }
  #end h1 { color: #fff; font-size: 104px; font-weight: 900; line-height: 1.08; letter-spacing: -2px; }
  #end h1 span { color: #FFD23F; }
  #end .tag { margin-top: 70px; color: #FFD23F; font-size: 48px; font-weight: 800; }
  #end .ai { position: absolute; bottom: 70px; left: 0; right: 0; color: #9a9aa0; font-size: 30px; font-weight: 500; }
  #progress { position: absolute; left: 0; bottom: 0; height: 10px; background: #E4572E; width: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="capbg"></div>
  <div id="scenes"></div>
  <div id="bubbles"></div>
  <div id="capbox"><div id="cap"></div></div>
  <div id="end">
    <h1>Sem povo com renda,<br>não tem empresa.<br><span>Nem país.</span></h1>
    <div class="tag">Dinheiro que circula é dinheiro que trabalha.</div>
    <div class="ai">Animação produzida com auxílio de inteligência artificial</div>
  </div>
  <div id="progress"></div>
</div>

<script>
// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const win = (t, a, b, f = .35) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
const $ = id => document.getElementById(id);
const setT = (id, x, y, s = 1, r = 0) => { const e = $(id); if (e) e.setAttribute('transform', `translate(${x} ${y}) rotate(${r}) scale(${s})`); };
const setO = (id, o) => { const e = $(id); if (e) e.style.opacity = o; };
const talking = (t) => Math.floor(t * 8) % 2 === 0;
const setMood = (id, mood) => { const e = $(id); if (!e) return; e.classList.remove('talk', 'laugh', 'sad'); if (mood) e.classList.add(mood); };
const pop = (id, t, a, b, cx, cy, base = 1) => { // scale-pop group around (cx,cy)
  const p = prog(t, a, a + .35), o = win(t, a, b, .25);
  const s = base * (b === Infinity ? backOut(p) : backOut(p));
  const e = $(id); if (!e) return;
  e.setAttribute('transform', `translate(${cx} ${cy}) scale(${Math.max(0.001, s)}) translate(${-cx} ${-cy})`);
  e.style.opacity = o;
};

  }
  // S6
  if (t > 62.4 && t < 72.4) {
    const zp = ease(prog(t, 62.6, 63.4));
    setT('s6-rosa-pos', lerp(340, 240, zp), lerp(700, 560, zp), lerp(2.0, 3.0, zp));
    setMood('s6-rosa', t > 68.6 ? 'laugh' : (t > 63 && t < 68.4 && talking(t) ? 'talk' : null));
  }
  // bubbles
  for (const b of bubbles) {
    const e = $(b.id); const o = win(t, b.a, b.b, .25); const p = backOut(prog(t, b.a, b.a + .35));
    e.style.opacity = o; e.style.transform = `scale(${Math.max(.001, t < b.a ? 0 : p)})`;
  }
  // captions
  let ci = caps.findIndex(c => t >= c.a && t < c.b);
  if (ci !== capCur) { capCur = ci; if (ci >= 0) { capEl.innerHTML = caps[ci].html; capEl.className = caps[ci].punch ? 'punch' : ''; } else { capEl.innerHTML = '<span style="color:#b9b4ab;font-size:40px;font-weight:700">🍰 Dona Rosa explica a economia</span>'; capEl.className = ''; } }
  if (ci < 0) { capEl.style.opacity = 1; capEl.style.transform = 'none'; }
  if (ci >= 0) { const c = caps[ci]; const o = win(t, c.a, c.b, .25); capEl.style.opacity = o; capEl.style.transform = `translateY(${(1 - prog(t, c.a, c.a + .3)) * 30}px)`; }
  // end
  $('end').style.opacity = prog(t, END[0], END[0] + .5);
  $('progress').style.width = (1080 * t / TOTAL) + 'px';
}
window.render = render; window.TOTAL = TOTAL;
render(0);
</script>
